name: Fetch ESPN data

on:
  schedule:
    # Five times a day, Central time: midnight, 8am, noon, 4pm, 8pm. The
    # site is mainly used for league news and Power Rankings rather than
    # live score-watching, so this trades in-game live freshness for a lot
    # of headroom against Vercel's Hobby-plan deployment limit (every
    # commit here triggers a redeploy) — changed 2026-09-15 from every 15
    # minutes after that limit got hit.
    #
    # GitHub Actions cron is fixed UTC and doesn't shift for daylight
    # saving, so each Central target time gets TWO entries below (one for
    # each possible UTC offset) — scripts/fetch-espn-data.mjs checks the
    # real Central time and no-ops on whichever one isn't actually a sync
    # window that day. No manual adjustment needed across DST changes.
    - cron: "0 1 * * *" # 8pm CT (CDT)
    - cron: "0 2 * * *" # 8pm CT (CST)
    - cron: "0 5 * * *" # midnight CT (CDT)
    - cron: "0 6 * * *" # midnight CT (CST)
    - cron: "0 13 * * *" # 8am CT (CDT)
    - cron: "0 14 * * *" # 8am CT (CST)
    - cron: "0 17 * * *" # noon CT (CDT)
    - cron: "0 18 * * *" # noon CT (CST)
    - cron: "0 21 * * *" # 4pm CT (CDT)
    - cron: "0 22 * * *" # 4pm CT (CST)
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data/*.json files back

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      # Not secrets — the league is publicly viewable, so these are just
      # plain IDs, not credentials. Change the season here each year.
      ESPN_LEAGUE_ID: "1040047778"
      ESPN_SEASON_ID: "2026"
      # Tells the script whether this is a scheduled run (which self-checks
      # the actual Central time before doing anything) or a manual run from
      # the Actions tab (which always runs).
      TRIGGER_EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest ESPN data
        run: node scripts/fetch-espn-data.mjs

      - name: Commit updated data (if anything changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update ESPN data snapshot"
          git push
